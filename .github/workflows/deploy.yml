# Publishes the site to Cloudflare Pages (https://jaxfast.pages.dev).
#
# Work happens on the develop branch: every push to develop is built, tested
# and published as a preview (https://develop.jaxfast.pages.dev).
# Merging develop into main and pushing main publishes the live site.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a Cloudflare API token
# with Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT: jaxfast
  CLOUDFLARE_URL: https://jaxfast.pages.dev

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The end-to-end tests run against the built site before anything is published.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true
      - name: Tell search engines about the pages (IndexNow)
        if: github.ref_name == 'main'
        continue-on-error: true
        run: node scripts/indexnow.mjs out
