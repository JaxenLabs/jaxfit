# The site lives on Cloudflare Pages (https://jaxfit.pages.dev). Cloudflare builds and
# publishes it itself on every push to main, and gives the develop branch its
# own preview address. Work happens on develop; merging it into main deploys.
#
# This workflow only keeps the old GitHub Pages address working: on every push
# to main it builds the site and publishes, in its place, pages that forward
# visitors and search engines to the same page on Cloudflare
# (scripts/github-redirects.mjs).
name: Forward GitHub Pages to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CLOUDFLARE_URL: https://jaxfit.pages.dev
  GITHUB_PAGES_FOLDER: /jaxfit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/github-redirects.mjs out github-pages "$CLOUDFLARE_URL" "$GITHUB_PAGES_FOLDER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
